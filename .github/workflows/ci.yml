name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -W error::ResourceWarning

  script-mode:
    name: script mode (self-install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the scripts with nothing installed, as the Claude Code skill does
        run: |
          python scripts/module_map.py tests/fixtures/feature/login --no-codegraph -o out/map.json
          python scripts/module_diagrams.py out/map.json -o out/doc.md
          grep -q "classDef layerPresentation" out/doc.md

  # The single check to require on main: it stays valid when the matrix above changes.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, script-mode]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All jobs passed"
